<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michael Abraham</title>
<meta name="description" content="Michael Abraham — Product Designer based in Indonesia. New portfolio in progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #141414;
    --muted: #898989;
    --line: #dadada;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--fg);
    font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  /* faint vertical grid lines: opaque near the top, fading to
     invisible by ~60% down, matching the Figma export */
  .grid-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 76.2%;
    pointer-events: none;
    z-index: 0;
  }
  .grid-lines span {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, var(--line) 0%, var(--line) 60%, transparent 79%);
  }
  .grid-lines span:nth-child(1) { left: 2.8%; }
  .grid-lines span:nth-child(2) { left: 26.82%; }
  .grid-lines span:nth-child(3) { left: 50.85%; }
  .grid-lines span:nth-child(4) { left: 74.88%; }
  .grid-lines span:nth-child(5) { left: 97.26%; }
  @media (max-width: 767px) {
    .grid-lines { height: 92.3%; }
    .grid-lines span:nth-child(1) { left: 10.32%; }
    .grid-lines span:nth-child(2) { left: 31.86%; }
    .grid-lines span:nth-child(3) { left: 53.15%; }
    .grid-lines span:nth-child(4) { left: 74.69%; }
    .grid-lines span:nth-child(5) { left: 89.88%; }
  }

  .intro {
    position: absolute;
    z-index: 1;
    left: 26.8%;
    top: 43.75%;
    width: 48.1%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }
  @media (max-width: 767px) {
    .intro {
      left: 10.26%;
      top: 35.6%;
      width: 79.5%;
      max-width: none;
    }
  }

  .avatar {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: block;
  }

  .intro p {
    margin: 0;
    font-size: clamp(16px, 1.65vw, 24px);
    line-height: 1.2;
    font-weight: 400;
  }
  .muted { color: var(--muted); }
  .dark { color: var(--fg); }
  .intro a {
    color: var(--fg);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .intro a:hover { color: #000; }

  /* wordmark: exact vector artwork exported from Figma, bottom-anchored */
  .wordmark-section {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
  }
  .wordmark-stack {
    position: relative;
    width: 100%;
  }
  .wordmark-stack img {
    display: block;
    width: 100%;
    height: auto;
  }
  .wordmark-stack .mobile-wordmark { display: none; }
  @media (max-width: 767px) {
    .wordmark-stack .desktop-wordmark { display: none; }
    .wordmark-stack .mobile-wordmark { display: block; }
  }

  /* Progressive background blur, based on Figma's own node data for
     "Rectangle 7" (fetched via the REST API): a white fill at
     opacity 0.02 (negligible tint by itself — it exists only to
     receive the blur) with a BACKGROUND_BLUR effect of blurType
     PROGRESSIVE, radius 0 -> 34 starting ~15% down this wordmark box
     and reaching full strength by the bottom. CSS has no
     continuously-variable backdrop-filter radius, so this is
     approximated with a single moderate blur revealed through a
     gradient mask — verified by live-patching the deployed page
     before committing (a multi-layer banded version was tried first
     but double-applying backdrop-filter in the overlapping bands
     compounded into far too strong a blur).
     Note: unprefixed mask-image is luminance-based (white = shown,
     black = hidden), so the gradient ramps toward white. */
  .wordmark-glass {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 15%, rgba(255,255,255,0.5) 45%, #fff 75%, #fff 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, transparent 15%, rgba(255,255,255,0.5) 45%, #fff 75%, #fff 100%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="grid-lines" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="intro">
      <img class="avatar" src="avatar.svg" alt="Michael Abraham" width="54" height="54">
      <p>
        <span class="muted">Michael Abraham is Product Designer based in Indonesia.</span><br>
        <span class="dark">New portfolio still in progress.</span>
        <span class="muted">You can</span>
        <a href="https://abraham-space.framer.website/" rel="noopener">check Portfolio 2026 here</a>
      </p>
    </div>

    <div class="wordmark-section">
      <div class="wordmark-stack">
        <img class="desktop-wordmark" src="wordmark-desktop.svg" alt="Michael Abraham — JKT, IDN">
        <img class="mobile-wordmark" src="wordmark-mobile.svg" alt="Michael Abraham — JKT, IDN">
        <div class="wordmark-glass" aria-hidden="true"></div>
      </div>
    </div>
  </main>
</body>
</html>
